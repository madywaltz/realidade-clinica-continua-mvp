<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realidade Clínica Contínua — MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#070708',
            surface: '#0f1115',
            surface2: '#161a21',
            gold: '#bf9a3d',
            goldSoft: '#d4b45a',
            border: '#1e2430',
            muted: '#8b93a7',
            text: '#e8eaed',
            danger: '#ef4444',
            success: '#22c55e',
            warn: '#f59e0b'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; background: #070708; color: #e8eaed; margin: 0; }
    .card { background: #0f1115; border: 1px solid #1e2430; }
    .card-hover:hover { border-color: #bf9a3d55; }
    .anticipation-high { border-left: 3px solid #bf9a3d; }
    .anticipation-medium { border-left: 3px solid #8b93a7; }
    .role-btn.active { background: #bf9a3d; color: #070708; font-weight: 600; }
    .role-btn { transition: all 0.15s ease; }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f1115; }
    ::-webkit-scrollbar-thumb { background: #1e2430; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const heloisa = {
      id: 'cccccccc-0000-0000-0000-000000000038',
      name: 'Heloísa Marques Pinto',
      age: 69,
      sex: 'feminino',
      cpf: '***.***.900-11',
      cns: '*** *** *** 0038',
      status: 'Em atendimento UPA',
      unit: 'UPA Sabará',
      chiefComplaint: 'Cefaleia súbita de forte intensidade com vômitos. Suspeita de AVE, déficit motor em MSD.',
      vitals: {
        paS: 128, paD: 88, fc: 72, fr: 16, temp: 36.5, sat: 98, peso: 78, altura: 178,
        time: '27/07/2026 00:04'
      },
      events: [
        { type: 'atendimento', title: 'Pronto atendimento (UPA)', date: '27/07/2026', loc: 'UPA Sabará', status: 'Em andamento' },
        { type: 'exame', title: 'Glicemia de jejum', date: '28/02/2025', loc: 'Lab. Municipal - Londrina', detail: '88 mg/dL (referência)' },
        { type: 'exame', title: 'Colesterol total e frações', date: '03/06/2025', loc: 'Lab. Municipal - Londrina', detail: 'LDL 152 mg/dL' },
        { type: 'vacina', title: 'Hepatite B — 3ª dose', date: '21/10/2024', loc: 'Santa Casa de Londrina' },
        { type: 'vacina', title: 'Febre amarela', date: '25/03/2024', loc: 'UBS Centro - Londrina' },
        { type: 'vacina', title: 'Tríplice viral (SCR)', date: '28/08/2023', loc: 'Lab. Municipal - Londrina' },
        { type: 'vacina', title: 'Dupla adulto (dT) — reforço 10 anos', date: '19/05/2025', loc: 'UBS Alvorada - Londrina' },
      ],
      gaps: [
        'Vacinas do calendário com atraso detectado',
        'Avaliação de deglutição não formalizada',
        'Risco de queda não registrado formalmente',
        'Plano de continuidade ainda ausente no registro'
      ]
    };

    function getAnticipations(role, learned) {
      const base = {
        medico: [
          {
            id: 'm1',
            priority: 'high',
            text: 'Você costuma abrir sinais vitais + SOAP da enfermagem primeiro em casos neurológicos. Já deixei ambos em evidência.',
            reason: 'Padrão observado em casos semelhantes',
            action: 'Continuar raciocínio a partir da triagem'
          },
          {
            id: 'm2',
            priority: 'high',
            text: 'Duas hipóteses de alta relevância ainda não formalizadas: AVE isquêmico vs enxaqueca complicada / secundária.',
            reason: 'Queixa + déficit motor + idade',
            action: 'Registrar hipóteses'
          },
          {
            id: 'm3',
            priority: 'medium',
            text: 'Glicemia de jejum (fev/2025) no limite superior. Considerar no contexto neurológico.',
            reason: 'Exame relevante para diagnóstico diferencial',
            action: 'Ver laudo'
          },
          {
            id: 'm4',
            priority: 'medium',
            text: 'LDL 152 mg/dL (jun/2025). Fator de risco cardiovascular presente.',
            reason: 'Histórico longitudinal',
            action: null
          }
        ],
        enfermeiro: [
          {
            id: 'e1',
            priority: 'high',
            text: 'Sinais vitais aferidos às 00:04. Em casos neurológicos você costuma reavaliar entre 20–30 min.',
            reason: 'Padrão de reavaliação',
            action: 'Reavaliar sinais vitais'
          },
          {
            id: 'e2',
            priority: 'high',
            text: 'Déficit motor MSD relatado. Avaliação de deglutição e risco de queda ainda não formalizadas.',
            reason: 'Lacunas de segurança detectadas',
            action: 'Registrar avaliação de risco'
          },
          {
            id: 'e3',
            priority: 'medium',
            text: 'Triagem já realizada. Classificação de risco aguarda confirmação médica.',
            reason: 'Fluxo de enfermagem',
            action: 'Evoluir triagem'
          },
          {
            id: 'e4',
            priority: 'low',
            text: 'Paciente em UPA. Verificar necessidade de posicionamento e contenção de risco de queda.',
            reason: 'Segurança do paciente',
            action: null
          }
        ],
        gestor: [
          {
            id: 'g1',
            priority: 'high',
            text: 'Caso em andamento na UPA Sabará com possível necessidade de imagem / especialidade / transferência.',
            reason: 'Pressão sobre capacidade',
            action: 'Ver impacto na fila e leitos'
          },
          {
            id: 'g2',
            priority: 'high',
            text: 'Risco de ocupação prolongada de leito + impacto na regulação.',
            reason: 'Logística territorial',
            action: 'Abrir visão de regulação'
          },
          {
            id: 'g3',
            priority: 'medium',
            text: 'Lacunas de continuidade detectadas (vacinas atrasadas + plano de continuidade ausente).',
            reason: 'Indicadores de qualidade',
            action: 'Ver cobertura do cuidado'
          },
          {
            id: 'g4',
            priority: 'low',
            text: 'Histórico de APS presente. Última consulta registrada.',
            reason: 'Continuidade assistencial',
            action: null
          }
        ]
      };

      let items = [...base[role]];
      if (learned.includes('reavaliar') && role === 'enfermeiro') {
        items = items.map(i => i.id === 'e1' ? { ...i, text: i.text + ' (você já interagiu com reavaliação — prioridade reforçada)', priority: 'high' } : i);
      }
      if (learned.includes('hipoteses') && role === 'medico') {
        items = items.map(i => i.id === 'm2' ? { ...i, text: i.text + ' (você já abriu o caminho de hipóteses)', priority: 'high' } : i);
      }
      return items;
    }

    function RoleSwitcher({ role, setRole }) {
      const roles = [
        { id: 'medico', label: 'Médico' },
        { id: 'enfermeiro', label: 'Enfermeiro' },
        { id: 'gestor', label: 'Gestor / Regulação' }
      ];
      return (
        <div className="flex gap-2 flex-wrap">
          {roles.map(r => (
            <button
              key={r.id}
              onClick={() => setRole(r.id)}
              className={`role-btn px-4 py-2 rounded-lg text-sm border border-border ${role === r.id ? 'active' : 'bg-surface2 text-muted hover:text-text'}`}
            >
              {r.label}
            </button>
          ))}
        </div>
      );
    }

    function PatientHeader({ patient }) {
      return (
        <div className="card rounded-xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <div className="flex items-center gap-3 mb-1 flex-wrap">
              <h1 className="text-2xl font-semibold tracking-tight">{patient.name}</h1>
              <span className="text-xs px-2 py-1 rounded-full bg-gold/10 text-gold border border-gold/30">
                {patient.status}
              </span>
            </div>
            <div className="text-sm text-muted flex flex-wrap gap-x-4 gap-y-1">
              <span>{patient.age} anos · {patient.sex}</span>
              <span>CPF {patient.cpf}</span>
              <span>CNS {patient.cns}</span>
              <span>{patient.unit}</span>
            </div>
          </div>
          <div className="text-right text-xs text-muted">
            <div className="text-gold font-medium">Realidade Clínica Contínua</div>
            <div>Modelo vivo · independe do papel</div>
          </div>
        </div>
      );
    }

    function VitalSigns({ vitals }) {
      const items = [
        { label: 'PA', value: `${vitals.paS}/${vitals.paD}`, unit: 'mmHg' },
        { label: 'FC', value: vitals.fc, unit: 'bpm' },
        { label: 'FR', value: vitals.fr, unit: 'irpm' },
        { label: 'Temp', value: vitals.temp, unit: '°C' },
        { label: 'Sat', value: vitals.sat, unit: '%' },
        { label: 'Peso', value: vitals.peso, unit: 'kg' },
      ];
      return (
        <div className="card rounded-xl p-4">
          <div className="text-xs uppercase tracking-wider text-muted mb-3">Sinais Vitais · {vitals.time}</div>
          <div className="grid grid-cols-3 md:grid-cols-6 gap-3">
            {items.map(i => (
              <div key={i.label} className="text-center">
                <div className="text-xs text-muted">{i.label}</div>
                <div className="text-lg font-semibold text-text">{i.value}</div>
                <div className="text-[10px] text-muted">{i.unit}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AnticipationSurface({ role, learned, onAction }) {
      const items = getAnticipations(role, learned);
      return (
        <div className="card rounded-xl p-5 fade-in">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div>
              <div className="text-xs uppercase tracking-wider text-gold mb-1">Antecipação · {role === 'medico' ? 'Médico' : role === 'enfermeiro' ? 'Enfermeiro' : 'Gestor'}</div>
              <h2 className="text-lg font-semibold">O que o sistema acredita que você precisa agora</h2>
            </div>
            <div className="text-xs text-muted">Aprende com o seu padrão</div>
          </div>
          <div className="space-y-3">
            {items.map(item => (
              <div
                key={item.id}
                className={`p-4 rounded-lg bg-surface2 border border-border card-hover ${item.priority === 'high' ? 'anticipation-high' : item.priority === 'medium' ? 'anticipation-medium' : ''}`}
              >
                <div className="flex justify-between gap-4 flex-col sm:flex-row">
                  <div className="flex-1">
                    <p className="text-sm leading-relaxed">{item.text}</p>
                    <p className="text-xs text-muted mt-2">↳ {item.reason}</p>
                  </div>
                  {item.action && (
                    <button
                      onClick={() => onAction(item.id, item.action)}
                      className="shrink-0 h-9 px-3 rounded-lg bg-gold/10 text-gold text-xs font-medium border border-gold/30 hover:bg-gold/20 transition self-start"
                    >
                      {item.action}
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ChiefComplaint({ text }) {
      return (
        <div className="card rounded-xl p-4">
          <div className="text-xs uppercase tracking-wider text-muted mb-2">Queixa principal / Estado atual</div>
          <p className="text-sm leading-relaxed text-text">{text}</p>
        </div>
      );
    }

    function Gaps({ gaps }) {
      return (
        <div className="card rounded-xl p-4">
          <div className="text-xs uppercase tracking-wider text-muted mb-3">Lacunas detectadas pelo modelo vivo</div>
          <ul className="space-y-2">
            {gaps.map((g, i) => (
              <li key={i} className="flex items-start gap-2 text-sm">
                <span className="text-warn mt-0.5">●</span>
                <span>{g}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function Timeline({ events }) {
      return (
        <div className="card rounded-xl p-4">
          <div className="text-xs uppercase tracking-wider text-muted mb-3">Linha do tempo · eventos conectados</div>
          <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
            {events.map(e => (
              <div key={e.title + e.date} className="flex gap-3 text-sm border-b border-border/50 pb-2 last:border-0">
                <div className="w-20 shrink-0 text-xs text-muted">{e.date}</div>
                <div className="flex-1">
                  <div className="font-medium">{e.title}</div>
                  <div className="text-xs text-muted">{e.loc}{e.detail ? ` · ${e.detail}` : ''}{e.status ? ` · ${e.status}` : ''}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LearningBadge({ learned }) {
      if (learned.length === 0) return null;
      return (
        <div className="text-xs text-gold/80 bg-gold/5 border border-gold/20 rounded-lg px-3 py-2">
          Padrões registrados nesta sessão: {learned.join(', ')} · o modelo começa a se adaptar
        </div>
      );
    }

    function App() {
      const [role, setRole] = useState('medico');
      const [learned, setLearned] = useState([]);

      const handleAction = (id, label) => {
        const key = id.startsWith('m2') ? 'hipoteses' : id.startsWith('e1') ? 'reavaliar' : id;
        if (!learned.includes(key)) {
          setLearned(prev => [...prev, key]);
        }
      };

      return (
        <div className="min-h-screen p-4 md:p-6 max-w-7xl mx-auto">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-gold/20 border border-gold/40 flex items-center justify-center text-gold font-bold text-sm">RC</div>
              <div>
                <div className="font-semibold tracking-tight">Realidade Clínica Contínua</div>
                <div className="text-xs text-muted">MVP · Camada viva sobre o prontuário longitudinal</div>
              </div>
            </div>
            <RoleSwitcher role={role} setRole={setRole} />
          </div>

          <PatientHeader patient={heloisa} />

          <div className="mt-4">
            <LearningBadge learned={learned} />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4">
            <div className="space-y-4">
              <ChiefComplaint text={heloisa.chiefComplaint} />
              <VitalSigns vitals={heloisa.vitals} />
              <Gaps gaps={heloisa.gaps} />
            </div>

            <div className="lg:col-span-2 space-y-4">
              <AnticipationSurface role={role} learned={learned} onAction={handleAction} />
              <Timeline events={heloisa.events} />
            </div>
          </div>

          <div className="mt-8 card rounded-xl p-5 text-sm text-muted leading-relaxed">
            <div className="text-gold font-medium mb-2">O que este MVP demonstra</div>
            <p>
              O mesmo paciente existe como um <strong style={{color:'#e8eaed'}}>modelo vivo único</strong>. 
              Ao trocar o papel (Médico / Enfermeiro / Gestor), a realidade apresentada muda radicalmente — 
              não apenas o filtro de dados, mas a <strong style={{color:'#e8eaed'}}>antecipação do que aquele profissional precisa ver agora</strong>, 
              baseada no estado clínico + no padrão de uso. 
              Clique nas ações sugeridas para simular o início do aprendizado do sistema.
            </p>
            <p className="mt-2">
              Esta é a camada que fica <em>acima</em> do seu prontuário longitudinal atual. 
              O longitudinal continua existindo como modo de exploração profunda. 
              A tela principal passa a ser esta: a realidade contínua filtrada e antecipada.
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
